<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#5aa9e6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>スノーグリル</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="img/icon-192.png">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="stylesheet" href="style.css?v=20260924i">
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>

    <header class="hud">
      <div class="chip money"><img src="img/ui/coin.webp" alt=""><span id="money">0</span></div>
      <div class="chip rescued"><span class="ico">🧑‍🤝‍🧑</span><span id="rescued">0</span></div>
      <button id="map-btn" class="hud-btn map" aria-label="全体マップ">🗺</button>
      <button id="mute-btn" class="hud-btn" aria-label="音のオン・オフ">🔊</button>
    </header>
    <div id="goal" class="goal">
      <div class="goal-top"><span id="village-name"></span><span id="goal-num"></span></div>
      <div class="goal-track"><div id="goal-bar" class="goal-bar"></div></div>
    </div>
    <div id="guide" class="guide hidden"></div>
    <button id="up-btn" class="up-btn" aria-label="強化"><span>⬆</span>強化</button>

    <!-- ===== 強化（レベルアップ） ===== -->
    <div id="upgrades" class="upgrades hidden">
      <div class="up-panel">
        <div class="up-head">
          <h2>⬆ 強化</h2>
          <div class="chip money"><img src="img/ui/coin.webp" alt=""><span id="up-money">0</span></div>
          <button id="up-close" class="up-close" aria-label="閉じる">✕</button>
        </div>
        <div id="up-list" class="up-list"></div>
      </div>
    </div>

    <!-- ===== 全体マップ ===== -->
    <div id="map" class="map hidden">
      <div class="map-head"><h2>🗺 北の大地</h2><button id="map-close" class="up-close" aria-label="閉じる">✕</button></div>
      <div class="map-area">
        <svg id="map-path" class="map-path" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
        <div id="map-nodes"></div>
      </div>
      <p class="map-note">村の人を救うと、次の村への道がひらく</p>
    </div>

    <!-- ===== 会話 ===== -->
    <div id="story" class="story hidden">
      <img id="story-face" class="story-face" src="" alt="">
      <div id="story-box" class="story-box">
        <div id="story-name" class="story-name"></div>
        <div id="story-text" class="story-text"></div>
        <div class="story-next">▼ タップで次へ</div>
      </div>
    </div>

    <div id="start" class="start">
      <div class="start-art">
        <img class="art-bear" src="img/bear_stand.webp" alt="">
        <img class="art-hero" src="img/hero_attack.webp" alt="">
        <img class="art-meat" src="img/meat_cooked.webp" alt="">
      </div>
      <h1 class="logo">スノー<br>グリル</h1>
      <p class="story">吹雪の雪原。凍えた人たちが<br>あたたかい肉を待っている…！</p>
      <button class="big-btn">▶ タップしてスタート</button>
      <p class="howto">タップした場所へ移動・ドラッグでも移動<br>白クマに近づくと自動で攻撃！</p>
    </div>
  </div>

  <script src="js/config.js?v=20260924i"></script>
  <script src="js/audio.js?v=20260924i"></script>
  <script src="js/story.js?v=20260924i"></script>
  <script src="js/game.js?v=20260924i"></script>
</body>
</html>
