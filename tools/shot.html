<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}iframe{border:0;width:100%;height:100%;display:block}</style>
</head><body>
<!-- 紹介用の画面写真を撮るためのページ（?scene=1〜3）。公開には使わない -->
<iframe id="f" src="../index.html?reset"></iframe>
<script>
const scene = +new URLSearchParams(location.search).get('scene') || 1;
const wait = ms => new Promise(r => setTimeout(r, ms));
document.getElementById('f').onload = async () => {
  const w = document.getElementById('f').contentWindow, d = w.document;
  await wait(1500);
  d.querySelector('.big-btn').click();
  await wait(300);
  const st = d.getElementById('story');
  const skip = () => { let n = 0; while (!st.classList.contains('hidden') && n++ < 40) { st.click(); st.click(); } };
  skip();
  const G = w.eval('G');
  if (scene === 3) { const C = w.eval('CONFIG'); C.volunteer.first = C.volunteer.every = 1e9; w.enterVillage('battle1'); skip(); }
  G.paused = false;
  const secs = scene === 3 ? 50 : scene === 2 ? 95 : 95;
  for (let i = 0; i < 30 * secs; i++) {
    if (!d.getElementById('recruit').classList.contains('hidden')) { d.querySelector('#recruit-choices button:not(.later)').click(); await wait(950); }
    if (!st.classList.contains('hidden')) skip();
    const g = w.currentGoal(); if (g) G.moveTo = { x: g.x, y: g.y, t: 0 };
    w.update(1 / 30);
  }
  G.fencePop = 1; G.texts = []; G.moveTo = null; G.guideT = 0; G.banner = null;
  const P = G.player;
  if (scene === 1) {
    const bs = G.bears.filter(b => b.state !== 'dead');
    const b = bs[0]; b.x = 330; b.y = 430;
    if (bs[1]) { bs[1].x = 500; bs[1].y = 360; bs[1].face = -1; }
    if (bs[2]) { bs[2].x = 150; bs[2].y = 300; }
    P.x = 272; P.y = 478; P.stack = ['raw', 'raw', 'raw', 'raw', 'raw', 'raw'];
    const h = G.helpers.find(h => h.type === 'sword'); if (h) { h.x = 392; h.y = 462; h.face = -1; h.downT = 0; }
    for (let i = 0; i < 4; i++) w.update(1 / 30);
    b.state = 'windup'; b.wt = 0.32; b.wtMax = 0.6; b.target = P; b.face = -1; b.hitT = 0.12;
    P.attackT = 0.08; P.face = 1; P.vx = P.vy = 0;
    w.fxAt('ui/slash', b.x, b.y - 45, 90, -0.3);
    for (let i = 0; i < 5; i++) w.dropMeat(b.x + 30, b.y - 20);
    for (let i = 0; i < 10; i++) w.update(1 / 60);
    // 戦っている最中に見えるように：白クマは倒さず、斬撃だけ出す
    G.fx = []; P.pendingHit = null; G.parts = [];
    b.hp = b.maxHp - 1; b.state = 'windup'; b.wt = 0.25; b.wtMax = 0.6; b.x = 330; b.y = 430; b.face = -1; b.hitT = 0;
    if (bs[1]) { bs[1].x = 160; bs[1].y = 330; bs[1].face = 1; bs[1].state = 'chase'; bs[1].hitT = 0; }
    if (bs[2]) { bs[2].x = 470; bs[2].y = 290; bs[2].face = -1; bs[2].hitT = 0; }
    G.fenceHp = G.fenceMax;
    P.x = 262; P.y = 470; P.attackT = 0.06; P.face = 1;
    w.fxAt('ui/slash', b.x - 10, b.y - 50, 90, -0.4);
    w.floatText(b.x, b.y - 100, '-1', '#ffe066', 28);
  } else if (scene === 2) {
    G.grills.forEach(g => { g.raw = 7; g.cooked = 5; g.t = 0.5; });
    G.counters.forEach(c => { c.stock = 6; });
    G.counters[0].cash = 40;
    P.x = 360; P.y = 930; P.face = 1; P.stack = ['cooked', 'cooked', 'cooked', 'cooked', 'cooked', 'cooked', 'cooked'];
    for (let i = 0; i < 20; i++) w.update(1 / 30);
    P.x = 380; P.y = 940; P.vx = P.vy = 0;
    for (let i = 0; i < 6; i++) G.coinFly.push({ x: 470 + i * 5, y: 1000, t: 0.1 + i * 0.06 });
  } else {
    // 決戦：巨人が出るところまで進める
    G.battle.wave = 2; G.battle.t = 0.1;
    for (let i = 0; i < 30 * 9; i++) { const g = w.currentGoal(); if (g) G.moveTo = { x: g.x, y: g.y, t: 0 }; w.update(1 / 30); }
    const gi = G.battle.giant;
    gi.x = 360; gi.y = 420; gi.state = 'windup'; gi.wt = 0.45; gi.wtMax = 1.15; gi.face = -1;
    P.x = 250; P.y = 560; P.face = 1; P.attackT = 0.08; P.moveTo = null;
    G.helpers.filter(h => h.type === 'sword').forEach((h, i) => { h.x = 440 + i * 40; h.y = 480 + i * 30; h.face = -1; h.downT = 0; h.attackT = 0.1; });
    G.bears.filter(b => b.raid && b.state !== 'dead').slice(0, 3).forEach((b, i) => { b.x = 150 + i * 60; b.y = 300 + i * 40; });
    w.banner('雪の巨人 あらわる！', '強い攻撃は赤い円でわかる。よけながら戦おう', 99);
    G.banner.t = 60; G.banner.life = 61;
  }
  // 会話・志願者・マップ・ガイドは閉じておく
  d.getElementById('recruit').classList.add('hidden');
  d.getElementById('map').classList.add('hidden');
  d.getElementById('guide').classList.add('hidden');
  st.classList.add('hidden');
  if (G.volunteer) { G.volunteer.gone = true; G.volunteer = null; }
  G.moveTo = null;
  G.cam.x = Math.max(0, Math.min(720 - G.viewW, P.x - G.viewW / 2));
  G.cam.y = Math.max(0, Math.min(1400 - G.viewH, P.y - G.viewH * (scene === 3 ? 0.62 : 0.55)));
  G.lookX = G.lookY = 0;
  G.paused = true;
  d.title = 'READY';
  document.title = 'READY';
};
</script>
</body></html>
